name: Build MangoHud Winlator Bionic

on:
  push:
    branches: [ winlator-bionic, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Android bionic build script
        run: |
          chmod +x scripts/build-android-bionic.sh
          ./scripts/build-android-bionic.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangoHud-Winlator-bionic-aarch64
          path: MangoHud-Winlator-bionic-aarch64.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winlator-bionic-latest
          name: MangoHud Winlator Bionic (latest build)
          body: |
            ## MangoHud for Winlator (Android bionic, aarch64)

            Automated build from the winlator-bionic branch.

            ### Changes vs upstream
            - frame_timing / frametime disabled by default (fixes flickering)
            - Fixed config file paths, no HOME environment variable needed
            - Android bionic compatibility patches

            ### Contents
            - lib/mangohud/libMangoHud.so
            - lib/mangohud/libMangoHud_opengl.so
            - lib/mangohud/libMangoHud_shim.so
            - cross-aarch64-android.txt
          files: MangoHud-Winlator-bionic-aarch64.zip
        if: success()
